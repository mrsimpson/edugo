      - generic "Beschreibung der Kompetenz" [ref=e130]:
        - paragraph [ref=e131]: Schülerinnen und Schüler können in einem Text oder einer Aussage Argumente identifizieren, deren Qualität einschätzen und begründet Stellung nehmen. Sie unterscheiden zwischen Behauptung, Begründung und Belegen, erkennen logische Fehlschlüsse und können eigene Argumentationsketten aufbauen.
        - heading "Warum diese Fähigkeit wichtig ist" [level=2] [ref=e132]
        - paragraph [ref=e133]: Digitale Medien produzieren täglich Millionen von Aussagen, Meinungen und Behauptungen. Die Fähigkeit, Argumente zu bewerten, ist keine akademische Disziplin — sie ist Überlebensvoraussetzung in einer Informationsgesellschaft. Schüler, die nicht zwischen "jemand sagt etwas" und "das ist gut begründet" unterscheiden können, sind in sozialen Netzwerken, bei politischen Entscheidungen und im Berufsleben benachteiligt.
