            - text: ": Strukturierte Kontroverse — Positionen zuweisen, Gegenargumente erarbeiten"
        - heading "Litmus-Test" [level=2] [ref=e142]
        - paragraph [ref=e143]: Welches Tool würde hier passen? Eines, das Schüler Argumente einreichen, bewerten und diskutieren lässt — mit strukturiertem Feedback und der Möglichkeit, die eigene Meinung zu revidieren. Mindestens 2–3 Tools könnten diese Lücke füllen.
