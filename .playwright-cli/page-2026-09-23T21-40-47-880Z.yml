        - heading "Was dieses Tool tut" [level=2] [ref=e313]
        - paragraph [ref=e314]: "Eine browserbasierte Anwendung, die zwei Texte nebeneinander zeigt und Schüler systematisch durch einen Vergleich führt: Welche Behauptungen werden aufgestellt? Sind Belege vorhanden? Welches Argument ist logisch stärker? Am Ende formulieren Schüler ein begründetes Urteil."
        - paragraph [ref=e315]: Das Tool speichert nichts — kein Login, kein Backend. Texte werden nur im Browser verarbeitet.
