          - strong [ref=e319]: Phase
          - text: ": Erarbeitungsphase (ca. 25 Minuten)"
        - list [ref=e320]:
          - listitem [ref=e321]: Lehrkraft bereitet zwei Texte vor (z.B. zwei Leserbriefe zur selben Frage)
          - listitem [ref=e322]: Schüler öffnen das Tool, laden die Texte ein (copy/paste oder Datei)
          - listitem [ref=e323]: "Das Tool führt durch strukturierte Analysefragen: Wo ist die Hauptthese? Was sind die Belege?"
          - listitem [ref=e324]: Jede Schülerin notiert ihr Urteil mit Begründung
          - listitem [ref=e325]: "Plenumsdiskussion: Welche Argumente wurden unterschiedlich bewertet?"
        - heading "Warum frontend-only" [level=2] [ref=e326]
        - paragraph [ref=e327]: Kein Text verlässt den Browser. Keine Nutzerdaten werden erhoben. Das Tool kann offline betrieben werden. Für Schultexte und Schülerarbeiten strukturell unbedenklich.