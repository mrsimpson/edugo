name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated schemas are in sync
        run: npm run check-schemas

      - name: Validate data files
        run: npm run validate-data

      - name: Build Vue app
        run: npm run build

      - name: Build VitePress docs
        run: npm run docs:build

      - name: Install arc42 CLI
        run: npm install -g @doctc/arc42@0.24.0

      - name: Build arc42 architecture docs
        run: arc42 build --dir docs/arc42 --out docs/.vitepress/dist/architecture --base /edugo/architecture/

      - name: Assemble deploy artifact
        run: |
          # Merge Vue app (Vite dist) into the VitePress dist root.
          # Vite builds to dist/ with base=/edugo/; VitePress builds to docs/.vitepress/dist/.
          # We copy the Vue app assets in without overwriting VitePress HTML pages.
          cp -rn dist/assets docs/.vitepress/dist/assets 2>/dev/null || cp -r dist/assets docs/.vitepress/dist/assets
          cp dist/index.html docs/.vitepress/dist/app.html
          # Publish JSON Schemas
          mkdir -p docs/.vitepress/dist/schemas
          cp schemas/generated/*.json docs/.vitepress/dist/schemas/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
