name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check generated schemas are in sync
        run: npm run check-schemas

      - name: Validate data files
        run: npm run validate-data

      - name: Install arc42 CLI
        run: npm install -g @doctc/arc42@0.24.0

      - name: Install biz42 CLI
        run: npm install -g biz42

      - name: Validate arc42 architecture docs
        run: node scripts/arc42-validate.mjs

      - name: Build Vue app (owns dist/ root at /edugo/)
        run: npm run build

      - name: Build VitePress docs (into dist/docs/ at /edugo/docs/)
        run: |
          npm run docs:build
          mkdir -p dist/docs
          cp -r docs/dist/. dist/docs/

      - name: Build arc42 architecture docs (into dist/architecture/)
        run: arc42 build --dir docs/arc42 --out dist/architecture --base /edugo/architecture/

      - name: Build biz42 business model (into dist/about/)
        run: biz42 build --out dist/about --base /edugo/about/

      - name: Publish JSON Schemas (into dist/schemas/)
        run: |
          mkdir -p dist/schemas
          cp schemas/generated/*.json dist/schemas/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against live site
        run: npx playwright test --reporter=github
